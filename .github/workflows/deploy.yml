name: Deploy Nginx on AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v2
      
      - name: Install dos2unix
        run: sudo apt-get update && sudo apt-get install -y dos2unix

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init & Apply
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

      - name: Install Ansible
        run: sudo apt update && sudo apt install -y ansible

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/mihir.pem
          chmod 600 ~/.ssh/mihir.pem
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/mihir.pem

      - name: Debug SSH Key Path
        run: |
          ls -l ~/.ssh
          cat ~/.ssh/mihir.pem | head -n 5

      - name: Add SSH Host Key to Known Hosts
        run: |
          INSTANCE_IP=$(awk '/^[0-9]/ {print $1}' ansible-setup/inventory)
          echo "Using Host: $INSTANCE_IP"
          ssh-keyscan -H "$INSTANCE_IP" >> ~/.ssh/known_hosts

      - name: Debug File Paths
        run: |
          ls -l ansible-setup/
          ls -l ansible-setup/inventory || echo "Inventory file is missing!"
          ls -l ansible-setup/nginx-setup.yml || echo "Playbook file is missing!"

      - name: Convert Inventory Encoding Only If Needed
        run: |
          FILE_ENCODING=$(file -bi ansible-setup/inventory | cut -d'=' -f2)
          if [[ "$FILE_ENCODING" == "utf-16le" || "$FILE_ENCODING" == "utf-16be" ]]; then
            echo "Converting from UTF-16 to UTF-8..."
            iconv -f UTF-16 -t UTF-8 ansible-setup/inventory -o ansible-setup/inventory
          else
            echo "Skipping conversion: Already UTF-8"
          fi
      
      - name: Fix Line Endings
          run: dos2unix ansible-setup/inventory || echo "dos2unix not needed"

      - name: Run Ansible Playbook
        run: |
          cd ansible-setup
          ansible-playbook -i ansible-setup/inventory ansible-setup/nginx-setup.yml
